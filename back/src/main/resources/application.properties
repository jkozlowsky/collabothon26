spring.application.name=back
# Bind to loopback only by default so the unauthenticated dev API is not exposed on shared Wi-Fi.
server.address=${SERVER_ADDRESS:127.0.0.1}

# PostgreSQL (started via ../docker-compose.yml). Override with env vars as needed.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:collabothon}
spring.datasource.username=${DB_USER:collabothon}
spring.datasource.password=${DB_PASSWORD:collabothon}

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Without this Flyway silently ignores misnamed files such as V3_foo.sql.
spring.flyway.validate-migration-naming=true

# Auto-load the root .env (works when started from back/ or repo root), so no `set -a; . ./.env` needed.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Origins allowed to call /api/** from the browser (Expo web dev server). Comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# Jev decision model (TypeSafe). jev.base-url and jev.model default in JevProperties; any
# Jev-compatible server works by setting jev.base-url. Without a key the hosted API is not called.
jev.api-key=${JEV_API_KEY:}
# Jev is the only outgoing HTTP client, so the shared RestClient timeouts are Jev's. The front waits 10 s in total,
# profile wait and retries included.
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=7s
# A followed redirect would re-send the answers and facts to a second host; the Jev API never redirects a POST.
spring.http.clients.redirects=dont-follow

# Duel tunables (app.duel.questions-per-match, question-timeout-ms, bot-min-delay-ms, bot-max-delay-ms; the
# last two are the simulated rival's answer times) default in DuelProperties.
app.duel.seed-demo-xp=true
