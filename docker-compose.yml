# Shared project name so git worktrees/checkouts reuse the same container and volume.
name: collabothon26

services:
  postgres:
    image: postgres:17-alpine
    container_name: collabothon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collabothon}
      POSTGRES_USER: ${POSTGRES_USER:-collabothon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabothon}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
