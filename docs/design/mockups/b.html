<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B: Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="b.css">
</head>
<body>
<main class="board">
<header class="dir-head">
  <h1>B Quest</h1>
  <p>Onboarding is the first quest: petrol hero like the Learn globe, yellow progress and main action, story cards to pick from.</p>
</header>

<!-- 1 Consent -->
<figure class="art"><figcaption>1 Consent</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <p class="over">Before your first quest</p>
    <p class="display">Make lessons about your money</p>
    <p class="lead">Share a few facts from your bank account and every lesson fits your life.</p>
    <div class="chips"><span class="schip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#bolt"/></svg>Takes 2 min</span><span class="schip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#rotate"/></svg>Withdraw any time</span></div>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <p class="sh">What we read</p>
    <div class="datagrid">
      <span class="dcell"><svg class="i" aria-hidden="true"><use href="icons.svg#user"/></svg>Age</span>
      <span class="dcell"><svg class="i" aria-hidden="true"><use href="icons.svg#wallet"/></svg>Income</span>
      <span class="dcell"><svg class="i" aria-hidden="true"><use href="icons.svg#safe"/></svg>Balance</span>
      <span class="dcell"><svg class="i" aria-hidden="true"><use href="icons.svg#cart"/></svg>Spending</span>
      <span class="dcell" style="grid-column:span 2"><svg class="i" aria-hidden="true"><use href="icons.svg#briefcase"/></svg>Products you hold</span>
    </div>
    <div class="info"><svg class="i" aria-hidden="true"><use href="icons.svg#bolt"/></svg><div><b>Sent to TypeSafe AI</b><p>Its Jev model categorises your profile automatically. We use it only to tailor your lessons. To withdraw, tap Redo onboarding in Profile.</p></div></div>
  </div></div>
  <div class="foot">
    <label class="consent"><span class="cbox"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span><span>I agree that my age, income, balance, spending and products are used to tailor lessons and sent to TypeSafe AI.</span></label>
    <button class="btn press">Continue</button>
    <button class="btn ghost press">Skip for now</button>
  </div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 2 Connect -->
<figure class="art"><figcaption>2 Connect your bank (demo)</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Back"><svg class="i" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></button></div>
    <p class="over">Connect your bank (demo)</p>
    <p class="display">Who are you today?</p>
    <p class="lead">Pick a demo customer. Their account stands in for yours.</p>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <button class="scard press" style="--c:var(--rose)"><span class="ring">L</span><span class="t"><b>Lena, 22</b><small>Student</small>
      <span class="kv"><span>Income <b>€900</b>/mo</span><span>Savings <b>€1,200</b></span><span>Spends <b>€800</b>/mo</span></span>
      <span class="pchips"><span class="pchip">Current account</span></span></span><span class="tick"></span></button>
    <button class="scard press" style="--c:var(--violet)"><span class="ring">M</span><span class="t"><b>Marco, 38</b><small>Family</small>
      <span class="kv"><span>Income <b>€4,200</b>/mo</span><span>Savings <b>€9,000</b></span><span>Spends <b>€3,600</b>/mo</span></span>
      <span class="pchips"><span class="pchip">Current account</span><span class="pchip">Savings account</span><span class="pchip">Mortgage</span></span></span><span class="tick"></span></button>
    <button class="scard on press" style="--c:var(--teal)" aria-pressed="true"><span class="ring">I</span><span class="t"><b>Ingrid, 58</b><small>Pre-retirement</small>
      <span class="kv"><span>Income <b>€3,800</b>/mo</span><span>Savings <b>€85,000</b></span><span>Spends <b>€2,900</b>/mo</span></span>
      <span class="pchips"><span class="pchip">Current account</span><span class="pchip">Savings account</span><span class="pchip">Life insurance</span><span class="pchip">Fund savings plan</span></span></span><span class="tick on"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span></button>
  </div></div>
  <div class="foot"><button class="btn press">Play as Ingrid</button></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 3a Goals -->
<figure class="art"><figcaption>3a Question 1/6: goals (multi-select)</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Back"><svg class="i" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></button><span class="story-bar" aria-hidden="true"><i class="f"></i><i></i><i></i><i></i><i></i><i></i></span><span class="count">1/6</span></div>
    <p class="display">What do you want your money to do?</p>
    <p class="lead">Pick all that apply.</p>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <button class="opt press"><span class="tile"><svg class="i" aria-hidden="true"><use href="icons.svg#safe"/></svg></span><span class="t">Build an emergency fund</span><span class="tick"></span></button>
    <button class="opt press"><span class="tile"><svg class="i" aria-hidden="true"><use href="icons.svg#home"/></svg></span><span class="t">Buy a home</span><span class="tick"></span></button>
    <button class="opt on press" aria-pressed="true"><span class="tile"><svg class="i" aria-hidden="true"><use href="icons.svg#sprout"/></svg></span><span class="t">Fund my retirement</span><span class="tick on"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span></button>
    <button class="opt on press" aria-pressed="true"><span class="tile"><svg class="i" aria-hidden="true"><use href="icons.svg#trend"/></svg></span><span class="t">Grow my wealth</span><span class="tick on"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span></button>
  </div></div>
  <div class="foot"><button class="btn press">Next</button></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 3b Knowledge -->
<figure class="art"><figcaption>3b Question 4/6: knowledge (single choice)</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Back"><svg class="i" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></button><span class="story-bar" aria-hidden="true"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i></span><span class="count">4/6</span></div>
    <p class="display">What does an ETF that tracks a world index give you?</p>
    <p class="lead">Pick one. Not knowing yet is fine.</p>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <button class="opt press"><span class="t">A guaranteed return</span><span class="tick"></span></button>
    <button class="opt on press" aria-pressed="true"><span class="t">Broad diversification at low cost</span><span class="tick on"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span></button>
    <button class="opt press"><span class="t">A stake in one large company</span><span class="tick"></span></button>
    <button class="opt press"><span class="t">I'm not sure</span><span class="tick"></span></button>
  </div></div>
  <div class="foot"><button class="btn press">Next</button></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 3c Confidence -->
<figure class="art"><figcaption>3c Question 6/6: confidence 1–5</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Back"><svg class="i" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></button><span class="story-bar" aria-hidden="true"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i></span><span class="count">6/6</span></div>
    <p class="display">How confident are you making your own investment decisions?</p>
    <p class="lead">No right answer. We'll ask again after your lessons.</p>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <div class="info" style="display:block;padding:20px 14px">
      <div class="scale" role="radiogroup" aria-label="Confidence from 1 to 5">
        <button class="press" role="radio" aria-checked="false">1</button>
        <button class="on press" role="radio" aria-checked="true">2</button>
        <button class="press" role="radio" aria-checked="false">3</button>
        <button class="press" role="radio" aria-checked="false">4</button>
        <button class="press" role="radio" aria-checked="false">5</button>
      </div>
      <div class="scale-labels"><span>Not confident</span><span>Very confident</span></div>
    </div>
  </div></div>
  <div class="foot"><button class="btn press">See my profile</button></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 4 Analysing -->
<figure class="art"><figcaption>4 Analysing</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="orbit-wrap">
    <div class="orbit" aria-hidden="true"><span class="ring-o"></span><span class="globe"></span></div>
    <p class="display">Analysing your profile with Jev…</p>
    <p class="lead">Jev, a decision model by TypeSafe AI, turns your answers and bank data into a learning profile.</p>
    <div class="steps">
      <span class="step"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg>Bank data read</span>
      <span class="step"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg>6 answers checked</span>
      <span class="step wait">Setting your levels</span>
    </div>
  </div>
  <span class="home-ind light"></span>
</div></figure>

<!-- 5a Result Jev -->
<figure class="art"><figcaption>5a Result: profiled by Jev</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <p class="over">Your profile is ready</p>
    <p class="display">Pre-retirement</p>
    <div class="chips"><span class="schip y"><svg class="i sm" aria-hidden="true"><use href="icons.svg#bolt"/></svg>Profiled by Jev</span><span class="schip">Jev 91%</span><span class="schip">3–10 years</span></div>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <p class="sh">Your levels</p>
    <div class="tiles">
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#safe"/></svg>Saving</span><b>Advanced</b><span class="pips"><i class="f"></i><i class="f"></i><i class="f"></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#trend"/></svg>Investing</span><b>Intermediate</b><span class="pips"><i class="f"></i><i class="f"></i><i></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#percent"/></svg>Risk</span><b>Beginner</b><span class="pips"><i class="f"></i><i></i><i></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#sprout"/></svg>Retirement</span><b>Intermediate</b><span class="pips"><i class="f"></i><i class="f"></i><i></i></span></div>
    </div>
    <div class="conf"><span class="num">2/5</span><div><b>Starting confidence</b><p>Your "before" point. We'll ask again after your lessons.</p></div></div>
    <p class="sh">Goals</p>
    <div class="goal-row"><span class="gchip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#sprout"/></svg>Fund my retirement</span><span class="gchip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#trend"/></svg>Grow my wealth</span></div>
    <p class="sh">Why Jev decided this</p>
    <div class="why"><p>Age 58 + fund savings plan → retirement: intermediate</p><span class="m"><span>From your bank data</span><span>Jev 88%</span></span></div>
    <div class="why"><p>€85,000 saved, about 29 months of spending, and the emergency fund answer was right → saving: advanced</p><span class="m"><span>Bank data + test</span><span>Jev 93%</span></span></div>
    <div class="why"><p>Picked "a rare opportunity" for high returns with no risk → risk: beginner</p><span class="m"><span>From your test</span><span>Jev 84%</span></span></div>
    <p class="fine"><svg class="i sm" aria-hidden="true"><use href="icons.svg#lock"/></svg>This profile tailors your lessons. It is not an investment suitability assessment or advice.</p>
  </div></div>
  <div class="foot"><button class="btn press">Start learning</button></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 5b Result fallback -->
<figure class="art"><figcaption>5b Result: rules fallback (offline)</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <p class="over">Your profile is ready</p>
    <p class="display">Pre-retirement</p>
    <div class="chips"><span class="schip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#book"/></svg>Profiled with rules (offline)</span><span class="schip">3–10 years</span></div>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <p class="offline">Jev couldn't be reached, so simple rules built this profile. Redo onboarding later to try Jev again.</p>
    <p class="sh">Your levels</p>
    <div class="tiles">
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#safe"/></svg>Saving</span><b>Intermediate</b><span class="pips"><i class="f"></i><i class="f"></i><i></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#trend"/></svg>Investing</span><b>Intermediate</b><span class="pips"><i class="f"></i><i class="f"></i><i></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#percent"/></svg>Risk</span><b>Beginner</b><span class="pips"><i class="f"></i><i></i><i></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#sprout"/></svg>Retirement</span><b>Beginner</b><span class="pips"><i class="f"></i><i></i><i></i></span></div>
    </div>
    <div class="conf"><span class="num">2/5</span><div><b>Starting confidence</b><p>Your "before" point. We'll ask again after your lessons.</p></div></div>
    <p class="sh">Goals</p>
    <div class="goal-row"><span class="gchip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#sprout"/></svg>Fund my retirement</span><span class="gchip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#trend"/></svg>Grow my wealth</span></div>
    <p class="sh">Why</p>
    <div class="why"><p>Age 58 → life stage: pre-retirement</p><span class="m"><span>Rule-based</span></span></div>
    <div class="why"><p>Emergency fund answer right → saving: intermediate</p><span class="m"><span>Rule-based</span></span></div>
    <div class="why"><p>No test question for retirement → retirement: beginner</p><span class="m"><span>Rule-based</span></span></div>
    <p class="fine"><svg class="i sm" aria-hidden="true"><use href="icons.svg#lock"/></svg>This profile tailors your lessons. It is not an investment suitability assessment or advice.</p>
  </div></div>
  <div class="foot"><button class="btn press">Start learning</button></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 6 Profile tab -->
<figure class="art"><figcaption>6 Profile tab</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero" style="padding-bottom:24px">
    <div class="me"><span class="ring" style="border-color:var(--teal)">I</span><span><b>Ingrid, 58</b><small>Pre-retirement</small></span></div>
    <div class="chips"><span class="schip y"><svg class="i sm" aria-hidden="true"><use href="icons.svg#bolt"/></svg>Profiled by Jev</span><span class="schip">Jev 91%</span><span class="schip">3–10 years</span><span class="schip">Confidence 2/5</span></div>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <p class="sh">Your levels</p>

      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#safe"/></svg>Saving</span><b>Advanced</b><span class="pips"><i class="f"></i><i class="f"></i><i class="f"></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#trend"/></svg>Investing</span><b>Intermediate</b><span class="pips"><i class="f"></i><i class="f"></i><i></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#percent"/></svg>Risk</span><b>Beginner</b><span class="pips"><i class="f"></i><i></i><i></i></span></div>
      <div class="ltile"><span class="head"><svg class="i sm" aria-hidden="true"><use href="icons.svg#sprout"/></svg>Retirement</span><b>Intermediate</b><span class="pips"><i class="f"></i><i class="f"></i><i></i></span></div>
    </div>
    <p class="sh">Goals</p>
    <div class="goal-row"><span class="gchip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#sprout"/></svg>Fund my retirement</span><span class="gchip"><svg class="i sm" aria-hidden="true"><use href="icons.svg#trend"/></svg>Grow my wealth</span></div>
    <p class="sh">Why Jev decided this</p>
    <div class="why"><p>Age 58 + fund savings plan → retirement: intermediate</p><span class="m"><span>From your bank data</span><span>Jev 88%</span></span></div>
    <div class="why"><p>€85,000 saved, about 29 months of spending, and the emergency fund answer was right → saving: advanced</p><span class="m"><span>Bank data + test</span><span>Jev 93%</span></span></div>

    <div class="consent-card">
      <div class="row"><svg class="i" aria-hidden="true"><use href="icons.svg#lock"/></svg><span class="t"><b>Bank data shared</b><small>Sent to TypeSafe AI for categorisation since 20 Nov 2026</small></span><span class="on-pill">On</span></div>
      <button class="row press"><svg class="i" aria-hidden="true"><use href="icons.svg#rotate"/></svg><span class="t"><b>Redo onboarding</b><small>Pick another demo customer or withdraw consent</small></span><svg class="i" aria-hidden="true" style="color:var(--muted)"><use href="icons.svg#chevron"/></svg></button>
    </div>
    <p class="fine"><svg class="i sm" aria-hidden="true"><use href="icons.svg#lock"/></svg>This profile tailors your lessons. It is not an investment suitability assessment or advice.</p>
  </div></div></div>
  <nav class="tabs" aria-label="Tabs">
    <button class="tab press"><svg class="i" aria-hidden="true"><use href="icons.svg#globe"/></svg>Learn</button>
    <button class="tab press"><svg class="i" aria-hidden="true"><use href="icons.svg#book"/></svg>Glossary</button>
    <button class="tab on press" aria-current="page"><svg class="i" aria-hidden="true"><use href="icons.svg#user"/></svg>Profile</button>
  </nav>
  <span class="home-ind"></span>
</div></figure>
</main>
</body>
</html>
