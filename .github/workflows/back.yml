name: back

on:
  pull_request:
    paths: [back/**, .github/workflows/back.yml, scripts/check-migrations.sh]
  push:
    branches: [main]
    paths: [back/**, .github/workflows/back.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: back/pom.xml
      - run: ./mvnw test

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-migrations.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
