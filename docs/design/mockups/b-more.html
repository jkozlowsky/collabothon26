<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B Quest: more screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="b.css">
<style>
/* Extra B Quest components for the rest of the app */
.hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.icon-chip { display: flex; gap: 8px; }
.reco { margin-top: 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 14px; }
.reco h3 { font: 700 18px/24px Inter; margin-top: 4px; }
.reco p { color: var(--land); margin-top: 4px; }
.reco .chips { margin-top: 10px; }
.reco .btn { margin-top: 14px; height: 48px; }
/* lesson path: story cards on a line */
.path { position: relative; display: flex; flex-direction: column; gap: 10px; }
.path::before { content: ""; position: absolute; left: 36px; top: 30px; bottom: 30px; width: 2px; background: var(--border-strong); }
.path .scard { position: relative; align-items: center; }
.scard .meta { display: block; font: 400 12px/16px Inter; color: var(--muted); margin-top: 2px; }
.scard.done .ring { background: var(--land); border-color: var(--land-edge); }
.scard.active { border: 2px solid var(--primary); padding: 13px; }
.scard.active .ring { background: var(--accent); border-color: var(--primary); }
.scard.locked { background: var(--canvas); border-style: dashed; border-color: var(--border-strong); }
.scard.locked .t > b { color: var(--muted); }
.scard.locked .ring { border-color: var(--border-strong); color: var(--muted); }
.tag { font: 600 12px/16px Inter; color: var(--on-accent); background: var(--accent); border-radius: 10px; padding: 2px 8px; flex: none; }
/* lesson intro */
.learn-list { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 4px 14px; }
.learn-list li { list-style: none; display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; font: 500 15px/20px Inter; }
.learn-list li + li { border-top: 1px solid var(--border); }
.learn-list .i { color: var(--success); margin-top: -2px; }
.reason { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.reason b { font: 600 13px/18px Inter; display: block; }
/* quiz feedback */
.opt.right { border: 2px solid var(--success); padding: 13px 15px; background: var(--land); }
.opt.right .tick { background: var(--success); border-color: var(--success); color: #fff; }
.opt.wrong { border: 2px solid var(--danger); padding: 13px 15px; }
.opt.wrong .tick { background: var(--danger); border-color: var(--danger); color: #fff; }
.opt.right small { color: var(--primary); }
.opt small { display: block; font: 500 12px/16px Inter; color: var(--muted); margin-top: 2px; }
.fb { flex: none; padding: 16px 20px 34px; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 10px; }
.fb.good { background: var(--land); }
.fb.bad { background: var(--accent-soft); }
.fb-head { display: flex; align-items: center; gap: 10px; }
.fb-head .dot { width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; color: #fff; flex: none; }
.fb.good .dot { background: var(--success); }
.fb.bad .dot { background: var(--danger); }
.fb-head b { font: 700 18px/24px Inter; flex: 1; }
.fb-head .xp { font: 600 12px/16px Inter; background: var(--primary); color: #fff; border-radius: 10px; padding: 2px 8px; }
.fb p { font: 400 13px/18px Inter; }
/* matching */
.match { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; }
.mt { min-height: 64px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); padding: 10px 12px; font: 600 13px/18px Inter; display: flex; align-items: center; gap: 8px; }
.mt.def { font-weight: 400; }
.mt.matched { background: var(--land); border-color: var(--land); color: var(--primary); }
.mt.matched .i { color: var(--success); }
.mt.sel { border: 2px solid var(--primary); background: var(--accent-soft); padding: 9px 11px; }
.counter { font: 500 12px/16px Inter; color: var(--muted); text-align: center; }
/* story step */
.story { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.story p { font: 400 15px/22px Inter; }
.term { display: inline; font: 600 15px/22px Inter; color: var(--primary); background: var(--accent-soft); border-bottom: 2px dotted var(--primary); border-radius: 4px; padding: 0 3px; }
.chart { position: relative; height: 128px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart .lab { position: absolute; font: 600 12px/16px Inter; color: var(--text); background: var(--surface); padding: 0 2px; }
.chart .lab.m { color: var(--muted); font-weight: 500; }
.hint { display: flex; gap: 8px; align-items: center; font: 400 12px/16px Inter; color: var(--muted); padding: 0 4px; }
/* bottom sheet over scrim */
.under { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scrim { position: absolute; inset: 0; background: rgba(0, 31, 41, .56); }
.bsheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 20px 34px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 32px rgba(0,31,41,.2); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 0 auto 8px; }
.bsheet .display { margin: 0; color: var(--text); }
.bsheet .def { font: 400 15px/20px Inter; }
.example { background: var(--canvas); border-radius: 12px; padding: 12px 14px; }
.example b { display: block; font: 600 12px/16px Inter; color: var(--muted); margin-bottom: 2px; }
.rel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rel span { font: 500 12px/16px Inter; color: var(--muted); }
.rchip { height: 44px; border-radius: 22px; padding: 0 16px; border: 1px solid var(--border-strong); font: 600 13px/18px Inter; color: var(--primary); }
.btn.outline { background: var(--surface); color: var(--primary); border: 1px solid var(--border-strong); font-weight: 600; }
/* decision */
.conseq { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 16px; padding: 14px; }
.conseq b { font: 600 15px/20px Inter; display: block; margin-bottom: 4px; }
.others { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.others p { color: var(--muted); }
.others p b { display: inline; font: 600 13px/18px Inter; color: var(--text); margin: 0; }
/* complete */
.win { color: #fff; text-align: center; padding: 8px 20px 24px; display: flex; flex-direction: column; align-items: center; }
.badge { width: 88px; height: 88px; border-radius: 44px; background: var(--accent); color: var(--on-accent); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(255,204,0,.16); margin-bottom: 16px; }
.badge b { font: 700 26px/32px Inter; }
.badge span { font: 700 10px/12px Inter; }
.win .chips { justify-content: center; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
.card > b { display: block; font: 600 15px/20px Inter; }
.card > p { color: var(--muted); margin-top: 2px; }
/* before/after bars (single series, direct labels, no legend) */
.ba { display: flex; align-items: flex-end; gap: 16px; margin-top: 12px; }
.bars { display: flex; align-items: flex-end; gap: 20px; height: 108px; padding: 0 6px; border-bottom: 1px solid var(--border-strong); flex: none; }
.bar { width: 40px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 700 15px/20px Inter; }
.bar i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--border-strong); }
.bar.now i { background: var(--primary); }
.bar-labels { display: flex; gap: 20px; padding: 6px 6px 0; font: 500 12px/16px Inter; color: var(--muted); }
.bar-labels span { width: 40px; text-align: center; }
.ba-text { flex: 1; padding-bottom: 22px; }
.ba-text b { font: 600 15px/20px Inter; display: block; }
.ba-text p { color: var(--muted); margin-top: 2px; }
.task { background: var(--surface); border: 2px solid var(--primary); border-radius: 16px; padding: 14px; }
.task .head { display: flex; gap: 10px; align-items: center; font: 600 12px/16px Inter; color: var(--muted); }
.task .head .i { color: var(--ocean-light); }
.task b { display: block; font: 700 18px/24px Inter; margin-top: 8px; }
.task p { color: var(--muted); margin-top: 4px; }
.task .btn { margin-top: 12px; height: 44px; }
/* glossary */
.search { margin-top: 16px; height: 48px; border-radius: 24px; background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; font: 400 15px/20px Inter; color: var(--text); background: transparent; }
.search input::placeholder { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.fchip { height: 44px; border-radius: 22px; padding: 0 14px; background: rgba(255,255,255,.12); color: #fff; font: 600 13px/18px Inter; }
.fchip.on { background: var(--accent); color: var(--on-accent); }
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.li { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.li + .li { border-top: 1px solid var(--border); }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; font: 600 15px/20px Inter; }
.li .t small { display: block; font: 400 12px/16px Inter; color: var(--muted); }
.li > .i { color: var(--muted); }
/* profile gamification */
.lvl-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; font: 600 12px/16px Inter; }
.lvl-line span:last-child { color: var(--land); font-weight: 500; }
.xpbar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); margin-top: 6px; }
.xpbar span { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.ltile small { display: block; font: 400 12px/16px Inter; color: var(--muted); margin-top: 8px; }
.jev { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.jev .top { display: flex; gap: 8px; align-items: center; padding: 14px 14px 4px; }
.jev .top .schip { background: var(--primary-soft); color: var(--primary); }
.jev .top .schip .i { color: var(--primary); }
.jev .top .schip.y { background: var(--accent); }
.kv2 { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; font: 400 13px/18px Inter; }
.kv2 + .kv2 { border-top: 1px solid var(--border); }
.kv2 span:first-child { color: var(--muted); }
.kv2 span:last-child { font-weight: 600; text-align: right; }
</style>
</head>
<body>
<main class="board">
<header class="dir-head">
  <h1>B Quest: more screens</h1>
  <p>The rest of the app in direction B for Ingrid (58): Learn path, one full lesson "When markets fall", Glossary and a Profile with XP, streak and confidence before and after.</p>
</header>

<!-- 1 Learn home -->

<div class="phone">

<!-- 2 Lesson intro -->
<figure class="art"><figcaption>2 Lesson intro</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Close"><svg class="i" aria-hidden="true"><use href="icons.svg#x"/></svg></button></div>

<!-- 3a Quiz -->
<figure class="art"><figcaption>3a Quiz step</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Close"><svg class="i" aria-hidden="true"><use href="icons.svg#x"/></svg></button><span class="story-bar" style="grid-template-columns:repeat(4,1fr)" aria-hidden="true"><i class="f"></i><i></i><i></i><i></i></span><span class="count">1/4</span></div>

    <button class="opt press"><span class="t">I've lost 20% for good</span><span class="tick"></span></button>
    <button class="opt on press" aria-pressed="true"><span class="t">Its value is down 20%, a loss only if I sell now</span><span class="tick on"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span></button>
    <button class="opt press"><span class="t">The bank has to pay back the difference</span><span class="tick"></span></button>
  </div></div>
  <div class="foot"><button class="btn press">Check</button></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 3b Quiz correct -->
<figure class="art"><figcaption>3b Quiz step: correct</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Close"><svg class="i" aria-hidden="true"><use href="icons.svg#x"/></svg></button><span class="story-bar" style="grid-template-columns:repeat(4,1fr)" aria-hidden="true"><i class="f"></i><i></i><i></i><i></i></span><span class="count">1/4</span></div>
    <p class="display">Your fund drops 20% in a month. What has happened to your money?</p>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <button class="opt press"><span class="t">I've lost 20% for good</span><span class="tick"></span></button>
    <button class="opt right press" aria-pressed="true"><span class="t">Its value is down 20%, a loss only if I sell now<small>Your answer</small></span><span class="tick"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span></button>
    <button class="opt press"><span class="t">The bank has to pay back the difference</span><span class="tick"></span></button>
  </div></div>
  <div class="fb good" role="status">
    <div class="fb-head"><span class="dot"><svg class="i" aria-hidden="true"><use href="icons.svg#check"/></svg></span><b>Correct</b><span class="xp">+10 XP</span></div>
    <p>A fall is a loss on paper until you sell. Prices can recover, though nobody can promise when.</p>
    <button class="btn press">Continue</button>
  </div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 3c Quiz wrong -->

<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Close"><svg class="i" aria-hidden="true"><use href="icons.svg#x"/></svg></button><span class="story-bar" style="grid-template-columns:repeat(4,1fr)" aria-hidden="true"><i class="f"></i><i></i><i></i><i></i></span><span class="count">1/4</span></div>
    <p class="display">Your fund drops 20% in a month. What has happened to your money?</p>
  </div>
  <div class="sheet"><div class="scroll"><div class="stack">
    <button class="opt wrong press" aria-pressed="true"><span class="t">I've lost 20% for good<small>Your answer</small></span><span class="tick"><svg class="i sm" aria-hidden="true"><use href="icons.svg#x"/></svg></span></button>
    <button class="opt right press"><span class="t">Its value is down 20%, a loss only if I sell now<small>Correct answer</small></span><span class="tick"><svg class="i sm" aria-hidden="true"><use href="icons.svg#check"/></svg></span></button>

<!-- 4 Matching -->

  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">

      <button class="mt def press">A loss locked in by selling</button>
      <button class="mt sel press" aria-pressed="true">Time horizon</button>
      <button class="mt def press">Spreading money across many investments</button>
      <button class="mt press">Realised loss</button>

  </div></div></div>
  <span class="home-ind"></span>
</div></figure>

<!-- 5 Story step -->
<figure class="art"><figcaption>5 Text / story step</figcaption>
<div class="phone">
  <div class="status"><span>9:41</span><span class="batt"></span></div>
  <div class="hero">
    <div class="hero-top"><button class="icon-btn press" aria-label="Close"><svg class="i" aria-hidden="true"><use href="icons.svg#x"/></svg></button><span class="story-bar" style="grid-template-columns:repeat(4,1fr)" aria-hidden="true"><i class="f"></i><i class="f"></i><i class="f"></i><i></i></span><span class="count">3/4</span></div>
    <p class="over">Good to know</p>
    <p class="display">Why a fall feels worse than it is</p>
  </div>
